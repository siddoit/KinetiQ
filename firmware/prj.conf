# KINETIQ firmware configuration — Zephyr on ESP32-S3-DevKitC-1

# Core kernel + logging (CBPRINTF_FP_SUPPORT is required for the %.2f float
# field in the telemetry JSON emitted by comm_thread).
CONFIG_LOG=y
CONFIG_MULTITHREADING=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Peripheral drivers used by the wearable sensor suite.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y

# BLE NUS telemetry (peripheral streaming JSON frames to the laptop client).
CONFIG_BT=y # enable the Bluetooth host stack
CONFIG_BT_PERIPHERAL=y # advertise + accept one GATT connection as a peripheral
CONFIG_BT_DEVICE_NAME="KINETIQ" # advertised name the laptop scans for
CONFIG_BT_L2CAP_TX_MTU=252 # allow full-length L2CAP payloads for fewer chunks
CONFIG_BT_BUF_ACL_TX_SIZE=256 # TX ACL buffers sized to the L2CAP MTU above
CONFIG_BT_BUF_ACL_RX_SIZE=256 # RX ACL buffers sized for laptop downlink writes
CONFIG_BT_MAX_CONN=1 # single laptop peer only, keeps RAM use minimal
