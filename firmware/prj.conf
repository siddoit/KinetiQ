# KINETIQ firmware configuration — Zephyr on ESP32-S3-DevKitC-1

# Core kernel + logging (CBPRINTF_FP_SUPPORT is required for the %.2f float
# field in the telemetry JSON emitted by comm_thread).
CONFIG_LOG=y
CONFIG_MULTITHREADING=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Peripheral drivers used by the wearable sensor suite.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
